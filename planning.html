function syncLedger(){
  if(!BRIDGE)return;
  let byMonth={};
  try{byMonth=BRIDGE.actuals(p.fromYM,p.toYM)||{};}catch(e){console.error('実績取得に失敗しました',e);return;}
  for(const m of p.months){
    if(m.source==='家計簿連動'&&m.phase!=='forecast'){
      const entry=byMonth[m.ym];
      m.actualNet=entry&&Number.isSafeInteger(entry.net)?entry.net:null;
    }
  }
}
function storedPlan(){
  const result=C.clone(p);
  for(const m of result.months)if(m.source==='家計簿連動')m.actualNet=null;
  return result;
}
function persist(){
  if(remote||corrupt){status();return false;}
  try{
    if(BRIDGE){
      const snapshot=storedPlan();
      C.validateProject(snapshot);
      const saved=BRIDGE.save(snapshot,serverRevision);
      serverRevision=saved.revision;
      p.revision=serverRevision;
    }else{
      p.revision=(Number(p.revision)||0)+1;
      const snapshot=storedPlan();
      C.validateProject(snapshot);
      localStorage.setItem(KEY,JSON.stringify(snapshot));
    }
    storageOK=true;
  }catch(e){
    storageOK=false;
    if(BRIDGE)corrupt=true; // Standalone can continue editing in memory and export JSON.
    console.error('資金計画の保存停止',e);
    toast(BRIDGE?'保存を停止しました：'+e.message:'自動保存を利用できません。JSON保存でバックアップしてください。');
  }
  status();
  return storageOK;
}

((r,ix)=>itemHTML(r,ix)).join('')||'<div class="empty">内訳がありません。下のボタンから追加できます。</div>'}</div><button class="btn quiet line-add" data-action="item-add">${I('plus')}内訳を追加</button><details class="editor-note"><summary>メモ・優先度</summary><textarea data-edit="group-note" aria-label="項目メモ" maxlength="3000">${esc(g.note)}</textarea><div class="field" style="margin-top:8px;max-width:160px"><label>優先度</label><select data-edit="group-priority">${opts([[1,'高い'],[2,'通常'],[3,'低い']],g.priority)}</select></div></details><div class="editor-footer">${I('info')}<span>「家計簿の実績に含まれる」「月別の見込みに含まれる」は重複するため、ここで再計上しません。「予約・発注済」などの状態だけでは集計を変更しません。計上方法は各行の ${I('more')} から設定できます。</span></div>`;
}
function itemHTML(r,ix){const a=C.rowAmount(r),rec=recognitionLabels[r.recognition],out=r.month&&(r.month<p.fromYM||r.month>p.toYM);return `<div class="itemwrap" data-drop="item" data-id="${esc(r.id)}"><div class="itemline"><button class="draghandle" draggable="true" data-drag="item" data-id="${esc(r.id)}" aria-label="${esc(r.title)}の順序を変更">${I('grip')}</button><input class="title-input" data-edit="item-title" data-id="${esc(r.id)}" value="${esc(r.title)}" maxlength="200" aria-label="内訳名"><input class="qty" type="number" step="0.1" min="0" max="100000" data-edit="item-qty" data-id="${esc(r.id)}" value="${r.qty??''}" aria-label="数量"><input class="unit" type="number" step="1" data-edit="item-unit" data-id="${esc(r.id)}" value="${r.unit??''}" aria-label="単価（円）"><span class="total num" id="total-${esc(r.id)}">${a===null?'未入力':yen(a)}</span><button class="icon-btn" data-action="item-more" data-id="${esc(r.id)}" aria-label="${esc(r.title)}の詳細" aria-expanded="${ui.openRows.has(r.id)}">${I('more')}</button><button type="button" class="icon-btn quick-delete" data-action="item-delete" data-id="${esc(r.id)}" title="${esc(r.title)}を削除（元に戻せます）" aria-label="${esc(r.title)}を削除">${I('trash')}</button></div><div class="item-bottom"><span>${r.month?esc(r.month.replace('-',' / ')):'時期未定'}</span>${r.recognition!=='extra'?`<span class="flag">${esc(rec)}</span>`:''}${out?'<span class="flag">期間外</span>':''}${r.status!=='planned'?`<span>${esc(statusLabels[r.status])}</span>`:''}</div>${ui.openRows.has(r.id)?`<div class="row-details"><div class="detail-grid"><div class="field"><label>予定月（空欄なら時期未定）</label><input type="month" data-edit="item-month" data-id="${esc(r.id)}" value="${esc(r.month)}"></div><div class="field"><label>状態</label><select data-edit="item-status" data-id="${esc(r.id)}">${opts(Object.entries(statusLabels),r.status)}</select></div><div class="field" style="grid-column:1/-1"><label>この支出・収入を合計へどう反映する？</label><select data-edit="item-recognition" data-id="${esc(r.id)}">${opts(Object.entries(recognitionLabels),r.recognition)}</select></div>${r.recognition==='partial'?`<div class="field"><label>実績内の金額（確認用）</label><input type="number" data-edit="item-actualAmount" data-id="${esc(r.id)}" value="${r.actualAmount??''}"></div><div class="field"><label>今後計上する残額（円）</label><input type="number" min="0" data-edit="item-remaining" data-id="${esc(r.id)}" value="${r.remaining??''}"></div>`:''}</div><p class="hint">${r.recognition==='extra'?'月次の実績・通常見込みには含めていない金額だけを別枠で計上します。':r.recognition==='recorded'?'この金額をすでに家計簿へ記帳し、その月の実績余剰に反映済みの場合に選びます。二重に支出計上しません。モック自体は照合しません。':r.recognition==='embedded'?'「月別収支」の今後の見込みへすでに含めている項目です。ここでは同じ金額を再計上しません。':r.recognition==='partial'?'実績分は月別実績で1回だけ反映。ここでは入力した「残額」だけを追加します。実績額を差し引く自動処理はしません。':'金額を保持したまま集計から除外します。既存積立を新しい収入として足さないための確認にも使用します。'}</p><textarea data-edit="item-note" data-id="${esc(r.id)}" aria-label="内訳メモ" maxlength="3000" placeholder="重複確認の根拠・候補など">${esc(r.note)}</textarea><div class="detail-actions"><div><button class="btn" data-action="item-up" data-id="${esc(r.id)}" ${ix===0?'disabled':''}>${I('up')}上へ</button> <button class="btn" data-action="item-down" data-id="${esc(r.id)}" ${ix===varOf().items.length-1?'disabled':''}>${I('down')}下へ</button></div><div><button class="btn quiet" data-action="item-copy" data-id="${esc(r.id)}">複製</button> <button class="btn quiet danger" data-action="item-delete" data-id="${esc(r.id)}">削除</button></div></div></div>`:''}</div>`;}
function chartHTML(a){
 const W=900,H=145,L=35,R=20,T=16,B=25;const vals=[0,...a.rows.map(r=>r.cumulative)],min=Math.min(...vals),max=Math.max(...vals),span=Math.max(1,max-min);const x=i=>L+i*(W-L-R)/Math.max(1,a.rows.length-1),y=v=>T+(max-v)/span*(H-T-B);const d=a.rows.map((r,i)=>(i?'L':'M')+x(i).toFixed(1)+','+y(r.cumulative).toFixed(1)).join(' ');const area=d+` L${x(a.rows.length-1)},${y(0)} L${x(0)},${y(0)} Z`;
 return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="月別の累積計画余剰。最終月 ${yen(a.rows.at(-1)?.cumulative||0)}。口座残高ではありません。"><defs><linearGradient id="chart-fill" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#9daf83" stop-opacity=".17"/><stop offset="1" stop-color="#9daf83" stop-opacity="0"/></linearGradient></defs>${[min,0,max].filter((v,i,ar)=>ar.indexOf(v)===i).map(v=>`<line x1="${L}" y1="${y(v)}" x2="${W-R}" y2="${y(v)}" stroke="#364036" stroke-dasharray="${v===0?'4 4':'1 0'}"/><text x="${L-7}" y="${y(v)+4}" text-anchor="end" fill="#9eaa9d" font-size="9">${Math.round(v/10000)}万</text>`).join('')}<path d="${area}" fill="url(#chart-fill)"/><path d="${d}" fill="none" stroke="#d5e5a0" stroke-width="2"/>${a.rows.map((r,i)=>`<circle cx="${x(i)}" cy="${y(r.cumulative)}" r="${r.phase==='actual'?3:3.5}" fill="${r.phase==='actual'?'#92b9a5':'#d5e5a0'}"><title>${r.ym}: ${yen(r.cumulative)}${r.unknown?'（未入力あり）':''}</title></circle><text x="${x(i)}" y="${H-3}" text-anchor="middle" fill="#9eaa9d" font-size="10">${Number(r.ym.slice(5))}月</text>`).join('')}</svg>`;
}
function renderMonths(){const a=C.calculate(p,sc());$('#view').innerHTML=`<div class="section-head"><div><h2>月々の余剰を積み上げる</h2><p>実績はすべての案で共通。見込みは「${esc(sc().name)}」だけに反映します。</p></div><button class="btn" data-action="bulk-flow">見込みをまとめて入力</button></div><div class="timeline"><div class="timeline-header"><div><h3>累積計画余剰</h3><p class="tiny muted">月内の入出金順序や、カード引落月は計算しません。</p></div><div class="legend"><span><i></i>実績</span><span><i class="future"></i>見込みを含む</span></div></div><div id="month-chart">${chartHTML(a)}</div></div><table class="month-table"><thead><tr><th>対象月</th><th>月の扱い</th><th>実績余剰 / 円</th><th>通常収支の見込み / 円</th><th>別枠の収支</th><th>累積余剰</th></tr></thead><tbody>${a.rows.map(row=>{const m=p.months.find(x=>x.ym===row.ym),f=sc().flows[row.ym]||{mode:'net',net:null,income:null,expense:null};return `<tr data-month="${row.ym}"><td><strong>${esc(row.ym.replace('-',' / '))}</strong></td><td><select data-edit="month-phase" data-ym="${row.ym}" aria-label="${row.ym}の扱い">${opts([['actual','実績入力済'],['open','途中 + 残見込'],['forecast','見込みのみ']],m?.phase||'forecast')}</select></td><td>${row.phase!=='forecast'?`<input type="number" data-edit="month-actual" data-ym="${row.ym}" value="${m?.actualNet??''}" ${m?.source==='家計簿連動'?'readonly':''} placeholder="未入力" aria-label="${row.ym}の実績余剰"><span class="sub">${esc(m?.source||'手入力')} / 全案共通</span><button type="button" class="btn" data-action="month-source" data-ym="${row.ym}" style="margin-top:4px;min-height:27px;padding:3px 8px">${m?.source==='家計簿連動'?'手入力に切替':'家計簿から取得'}</button>`:'<span class="muted">対象外</span>'}</td><td>${row.phase!=='actual'?`<div class="forecast-controls"><select data-edit="flow-mode" data-ym="${row.ym}" aria-label="${row.ym}の入力方式">${opts([['net','余剰額'],['detail','収入−支出']],f.mode)}</select>${f.mode==='net'?`<input type="number" data-edit="flow-net" data-ym="${row.ym}" value="${f.net??''}" placeholder="未入力" aria-label="${row.ym}の見込み余剰">`:''}</div>${f.mode==='detail'?`<div class="detailed"><input type="number" data-edit="flow-income" data-ym="${row.ym}" value="${f.income??''}" placeholder="収入" aria-label="${row.ym}の見込み収入"><input type="number" data-edit="flow-expense" data-ym="${row.ym}" value="${f.expense??''}" placeholder="支出" aria-label="${row.ym}の見込み支出"></div>`:''}<span class="sub">${row.phase==='open'?'これからの残り分のみ':'この月の全期間分'} / 臨時財源・特別支出は含めない</span>`:'<span class="tiny muted">実績のみを採用</span>'}</td><td class="num" id="extra-${row.ym}">${signed(row.income-row.expense)}</td><td class="num ${row.cumulative<0?'neg':''}" id="cum-${row.ym}">${yen(row.cumulative)}</td></tr>`;}).join('')}</tbody></table><div class="info-note">未入力は0円とは異なります。未入力を含む場合は、入力済み部分の暫定合計として表示します。過去月を自動で確定したり、実績と月全体の見込みを足し合わせたりしません。</div><div id="issues">${viewIssues(a)}</div>`;}
function renderCompare(){const sums=p.scenarios.map(s=>C.calculate(p,s));const basic=sums[0];const rows=[['想定財源',a=>yen(a.resources)],['実績余剰（共通）',a=>yen(a.actual)],['通常収支の見込み',a=>yen(a.forecast)],['臨時財源',a=>yen(a.extraIncome)],['別枠の支出予定',a=>yen(a.extraExpense)],['残しておく余力',a=>yen(a.reserve)],['期間外に残る支出',a=>yen(a.outsideExpense)]];
 $('#view').innerHTML=`<div class="section-head"><div><h2>どの組み合わせで進めるか</h2><p>同じ月別実績を使い、構成・予定月・見込みの違いを比較します。</p></div><button class="btn primary" data-action="scenario-copy">${I('copy')}案を複製</button></div><div class="compare-wrap"><table class="compare-table"><thead><tr><th>対象期間 ${esc(p.fromYM)}<br>〜 ${esc(p.toYM)}</th>${p.scenarios.map(s=>`<th class="${s.id===p.activeScenario?'selected-col':''}"><button class="scenario-name" data-action="scenario-rename" data-id="${esc(s.id)}" title="名前を変更">${esc(s.name)}</button><p class="tiny muted">${esc(s.description||'独立した比較案')}</p></th>`).join('')}</tr></thead><tbody><tr class="primary-row"><td>未配分余力</td>${sums.map((a,i)=>`<td class="num ${p.scenarios[i].id===p.activeScenario?'selected-col':''}" style="${a.margin<0?'color:var(--red)':''}">${yen(a.margin)}${a.unknownCount?'<div class="tiny gold">暫定・未入力あり</div>':''}</td>`).join('')}</tr><tr class="row-muted"><td>最初の案との差</td>${sums.map((a,i)=>`<td>${i===0?'基準':signed(a.margin-basic.margin)}</td>`).join('')}</tr>${rows.map(([name,fn])=>`<tr><td>${name}</td>${sums.map((a,i)=>`<td class="num ${p.scenarios[i].id===p.activeScenario?'selected-col':''}">${fn(a)}</td>`).join('')}</tr>`).join('')}<tr><td>操作</td>${p.scenarios.map(s=>`<td><button class="btn ${s.id===p.activeScenario?'primary':''}" data-action="scenario" data-id="${esc(s.id)}">${s.id===p.activeScenario?'編集中':'この案を編集'}</button><br><button class="btn quiet danger" data-action="scenario-delete" data-id="${esc(s.id)}" ${p.scenarios.length<=1?'disabled':''}>削除</button></td>`).join('')}</tr></tbody></table></div><div class="info-note">「来期へ先送り」は支出を消したのではありません。期間外の支出として保持しています。各案を編集しても、他案のプリセットや見込みは変更しません。</div>`;
}

 renderGroupList();const g=group();if(g){const st=C.groupStats(p,g);if($('#editor-total'))$('#editor-total').textContent=yen(st.effect);if($('#editor-subtotal'))$('#editor-subtotal').textContent='内訳総額 '+yen(st.budget)+(st.outside?' · 期間外 '+yen(st.outside):'')+(st.unknown?' · 未入力あり':'');for(const r of C.variantOf(g).items){const e=document.getElementById('total-'+r.id);if(e)e.textContent=C.rowAmount(r)===null?'未入力':yen(C.rowAmount(r));}}
 } else if(ui.view==='months'){const a=C.calculate(p,sc());$('#month-chart').innerHTML=chartHTML(a);for(const r of a.rows){$('#extra-'+r.ym).textContent=signed(r.income-r.expense);$('#cum-'+r.ym).textContent=yen(r.cumulative);$('#cum-'+r.ym).classList.toggle('neg',r.cumulative<0);}}

function dialog(title,body,buttons,submit){const d=$('#dialog');d.innerHTML=`<form id="dialog-form"><div class="dialog-header"><h2 id="dialog-title">${esc(title)}</h2><button type="button" class="icon-btn" data-close aria-label="閉じる">${I('close')}</button></div><div class="dialog-body">${body}</div><div class="dialog-footer"><button type="button" class="btn" data-close>キャンセル</button>${buttons||'<button class="btn primary" type="submit">保存する</button>'}</div></form>`;if(!d.open)d.showModal();$$('[data-close]',d).forEach(b=>b.onclick=()=>d.close());$('#dialog-form').onsubmit=e=>{e.preventDefault();try{const result=submit?.(new FormData(e.currentTarget));if(result!==false)d.close();}catch(err){toast(err.message);}};const firstInput=$('input:not([type=hidden])',d);if(firstInput)firstInput.focus();}
function confirmAction(title,body,fn){dialog(title,`<p>${esc(body)}</p>`,'<button class="btn primary" type="submit">実行する</button>',fn);}
function renameDialog(title,value,fn){dialog(title,`<div class="field"><label>名前</label><input name="name" value="${esc(value)}" maxlength="120" required></div>`,null,fd=>{const name=fd.get('name').trim();if(!name)throw Error('名前を入力してください');fn(name);});}

 const from=fd.get('from'),to=fd.get('to');const keys=C.monthsBetween(from,to),reserve=moneyInput(fd.get('reserve'));if(reserve===null||reserve<0)throw Error('残す余力を0以上の整数で入力してください');if(!fd.get('title').trim())throw Error('計画名を入力してください');
 mutate('計画の設定を保存しました',()=>{p.title=fd.get('title').trim();p.fromYM=from;p.toYM=to;sc().reserve=reserve;for(const ym of keys){if(!p.months.some(m=>m.ym===ym))p.months.push({ym,phase:'forecast',actualNet:null,source:'家計簿連動',note:''});for(const s of p.scenarios)if(!s.flows[ym])s.flows[ym]={mode:'net',net:null,income:null,expense:null};}});
 });$('#new-blank').onclick=()=>confirmAction('空の計画にする','この資金計画の内容を空の計画に置き換えます。必要なデータは先にJSON保存してください。',()=>mutate('空の計画を作成しました',()=>{p=C.clone(SEED);p.title='新しい支出計画';p.demo=false;p.scenarios=[{id:'base',name:'基本案',description:'',reserve:0,groups:[],flows:Object.fromEntries(p.months.map(m=>[m.ym,{mode:'net',net:null,income:null,expense:null}]))}];for(const m of p.months){m.actualNet=null;m.source='家計簿連動';m.note='';}p.activeScenario='base';ui.selected=null;}));}

    '<button class="btn primary" type="submit">閉じる</button>',()=>{});
}
function guideDialog(){dialog('計算と操作のルール',`<h3>1 / 余力は、口座残高ではありません</h3><p>実績余剰 ＋ 通常見込み ＋ 別枠財源 − 別枠支出 − 残す余力。赤字もそのまま積み上げ、0円に丸めません。</p><h3>2 / 1つの金額を1回だけ</h3><p>月別の見込みに入れた賞与は「月別の見込みに含まれる」。記帳済みの購入は「家計簿の実績に含まれる」。実績との照合は手動確認です。空欄は未入力であり、0円とは区別します。</p><h3>3 / 編集範囲</h3><p>月別実績・期間はすべての案で共通。支出・財源・プリセット・将来の見込みは編集中の案だけに反映します。全体の案は独立コピーなので他案が連動して書き換わりません。</p><h3>4 / 並び替え・取り消し</h3><p>自由順ではハンドルをドラッグできます。スマホでは項目の上下矢印、内訳の詳細にある上下ボタンでも移動できます。上部の矢印で30操作まで取り消し・やり直し。編集欄内の文字入力はブラウザの取り消しを使います。</p><h3>5 / 実装していないもの</h3><p>銀行残高、資金繰り、カード引落予測、家計簿取引との自動照合、既存積立・ほしいものの自動連携はこのモックの対象外です。</p>`,`<button class="btn primary" type="submit">閉じる</button>`,()=>{});}
function resetDemo(){confirmAction('空の計画に戻す','計画データを空にします。既存の家計簿の取引は変更しません。',()=>{corrupt=false;remote=null;mutate('空の計画に戻しました',()=>{p=C.clone(SEED);ui.view='expense';ui.selected=null;ui.mobileDetail=false;});});}
function reorder(kind,from,to){if(from===to)return;mutate('順序を変更しました',()=>{if(kind==='item'){const a=varOf().items,i=a.findIndex(r=>r.id===from),j=a.findIndex(r=>r.id===to);if(i<0||j<0)return;a.splice(j,0,a.splice(i,1)[0]);}else{const a=sc().groups,i=a.findIndex(g=>g.id===from),j=a.findIndex(g=>g.id===to);if(i<0||j<0||a[i].kind!==a[j].kind)return;a.splice(j,0,a.splice(i,1)[0]);}});}
function move(kind,which,delta){const list=kind==='item'?varOf().items:sc().groups.filter(g=>g.kind===ui.view);const ix=list.findIndex(g=>g.id===which),target=list[ix+delta];if(target)reorder(kind,which,target.id);}
function exportData(){const blob=new Blob([JSON.stringify(p,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='kakeibo-planning-v1.9.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),2000);toast('資金計画をJSONに書き出しました');}
function bulkFlowDialog(){dialog('通常収支の見込みをまとめて入力',`<p>実績入力済みの月は変更しません。進行中の月は「今後の残り分」として設定します。賞与や特別支出を別枠に登録する場合、ここには含めないでください。</p><div class="fields"><div class="field"><label>開始月</label><input type="month" name="from" value="${p.months.find(m=>m.phase!=='actual'&&m.ym>=p.fromYM&&m.ym<=p.toYM)?.ym||p.fromYM}" required></div><div class="field"><label>終了月</label><input type="month" name="to" value="${p.toYM}" required></div><div class="field wide"><label>各月の余剰見込み / 円</label><input type="number" name="net" step="1" required placeholder="例：25000"></div></div>`,null,fd=>{const keys=C.monthsBetween(fd.get('from'),fd.get('to'));const n=moneyInput(fd.get('net'));if(n===null)throw Error('金額を入力してください');const targets=keys.filter(k=>k>=p.fromYM&&k<=p.toYM&&p.months.find(m=>m.ym===k)?.phase!=='actual');if(!targets.length)throw Error('対象となる見込み月がありません');mutate(targets.length+'か月の見込みを更新しました',()=>targets.forEach(k=>sc().flows[k]={mode:'net',net:n,income:null,expense:null}));});}
// Event delegation avoids rebinding problems when rows are re-rendered.
document.addEventListener('click',event=>{
 const b=event.target.closest('[data-action]');if(!b||b.disabled)return;const a=b.dataset.action,which=b.dataset.id;
 try{
 if(a==='nav')return navigate(b.dataset.value);if(a==='compare')return navigate('compare');
 if(a==='month-source'){const month=p.months.find(m=>m.ym===b.dataset.ym);if(!month)return;return mutate('実績の入力方式を切り替えました',()=>{month.source=month.source==='家計簿連動'?'手入力':'家計簿連動';if(month.source==='家計簿連動')month.actualNet=null;});}
 if(a==='scenario'){editingKey=null;p.activeScenario=which;ui.openRows.clear();ui.mobileDetail=false;persist();render();return;}
 if(a==='group-select'){ui.selected=which;ui.mobileDetail=true;ui.openRows.clear();editingKey=null;render();if(matchMedia('(max-width:760px)').matches)$('#editor').scrollIntoView({block:'start',behavior:'auto'});return;}
 if(a==='back-list'){ui.mobileDetail=false;render();return;}
 if(a==='item-more'){ui.openRows.has(which)?ui.openRows.delete(which):ui.openRows.add(which);renderEditor();return;}
 if(a==='variant')return mutate('採用するプリセットを切り替えました',()=>{group().selected=which;ui.openRows.clear();});
 if(a==='group-add'&&sc().groups.length>=100)return toast('項目は100件までです');
 if(a==='group-add')return renameDialog('新しい'+(ui.view==='income'?'財源':'支出')+'項目','新しい項目',name=>mutate('項目を追加しました',()=>{const gid=id();sc().groups.push({id:gid,title:name,kind:ui.view==='income'?'income':'expense',icon:ui.view==='income'?'income':'plan',enabled:true,priority:2,selected:'base',note:'',variants:[{id:'base',name:'基本案',items:[{id:id(),title:'新しい内訳',qty:1,unit:null,month:p.months.find(m=>m.phase!=='actual'&&m.ym>=p.fromYM&&m.ym<=p.toYM)?.ym||p.toYM,recognition:'extra',remaining:0,actualAmount:0,status:'planned',note:''}]}]});ui.selected=gid;ui.mobileDetail=true;}));
 if(a==='group-copy')return mutate('項目を複製しました',()=>{const g=C.clone(group());g.id=id();g.title+='（コピー）';sc().groups.splice(sc().groups.indexOf(group())+1,0,g);ui.selected=g.id;});
 if(a==='group-delete'){const target=which||ui.selected;if(!sc().groups.some(g=>g.id===target))return;mutate('',()=>{sc().groups=sc().groups.filter(g=>g.id!==target);if(ui.selected===target){ui.selected=null;ui.mobileDetail=false;}});toastUndo('項目を削除しました');return;}
 if(a==='group-up'||a==='group-down')return move('group',which,a==='group-up'?-1:1);
 if(a==='item-up'||a==='item-down')return move('item',which,a==='item-up'?-1:1);
 if(a==='item-add')return mutate('内訳を追加しました',()=>{varOf().items.push({id:id(),title:'新しい内訳',qty:1,unit:null,month:varOf().items.at(-1)?.month||p.fromYM,recognition:'extra',remaining:0,actualAmount:0,status:'planned',note:''});});
 if(a==='item-copy')return mutate('内訳を複製しました',()=>{const ar=varOf().items,ix=ar.findIndex(r=>r.id===which),r=C.clone(ar[ix]);r.id=id();r.title+='（コピー）';ar.splice(ix+1,0,r);});
 if(a==='item-delete'){if(!varOf().items.some(r=>r.id===which))return;mutate('',()=>{varOf().items=varOf().items.filter(r=>r.id!==which);});toastUndo('内訳を削除しました');return;}
 if(a==='variant-add'){if(group().variants.length>=12)return toast('プリセットは12件までです');return renameDialog('プリセットを複製',varOf().name+' コピー',name=>mutate('独立したプリセットを追加しました',()=>{const v=C.clone(varOf());v.id=id();v.name=name;group().variants.push(v);group().selected=v.id;}));}
 if(a==='variant-edit'){const v=varOf();dialog('プリセットを管理',`<div class="field"><label>名前</label><input name="name" value="${esc(v.name)}" required maxlength="120"></div><div style="margin-top:16px"><button type="button" class="btn danger" id="delete-variant" ${group().variants.length<=1?'disabled':''}>このプリセットを削除</button></div>`,null,fd=>{if(!fd.get('name').trim())throw Error('名前を入力してください');mutate('名前を更新しました',()=>v.name=fd.get('name').trim());});$('#delete-variant').onclick=()=>confirmAction('プリセットを削除',v.name+' の内訳を削除します。他の案の同名プリセットは変わりません。',()=>mutate('プリセットを削除しました',()=>{group().variants=group().variants.filter(x=>x.id!==v.id);group().selected=group().variants[0].id;}));return;}
 if(a==='scenario-copy'){if(p.scenarios.length>=12)return toast('全体シナリオは12案までです');return renameDialog('全体シナリオを複製',sc().name+' コピー',name=>mutate('独立した比較案を作成しました',()=>{const s=C.clone(sc());s.id=id();s.name=name;s.description='独立コピー / '+sc().name+'から作成';p.scenarios.push(s);p.activeScenario=s.id;}));}
 if(a==='scenario-rename'){const s=p.scenarios.find(s=>s.id===which);return renameDialog('シナリオ名を変更',s.name,name=>mutate('シナリオ名を変更しました',()=>s.name=name));}
 if(a==='scenario-delete'){if(p.scenarios.length<2)return;return confirmAction('全体シナリオを削除','この案の計画・プリセットを削除します。共通の月別実績と他の案は残ります。',()=>mutate('シナリオを削除しました',()=>{p.scenarios=p.scenarios.filter(s=>s.id!==which);if(p.activeScenario===which)p.activeScenario=p.scenarios[0].id;}));}
 if(a==='undo'){if(past.length){future.push(C.clone(p));p=past.pop();editingKey=null;persist();render();toast('直前の編集を取り消しました');}return;}
 if(a==='redo'){if(future.length){past.push(C.clone(p));p=future.pop();editingKey=null;persist();render();toast('編集をやり直しました');}return;}
 if(a==='export')return exportData();if(a==='import')return $('#json-file').click();if(a==='settings')return settingsDialog();if(a==='source')return sourceDialog();if(a==='guide')return guideDialog();if(a==='reset')return resetDemo();if(a==='bulk-flow')return bulkFlowDialog();
 if(a==='reload-remote')return confirmAction('別タブの内容を読み込む','この画面の編集中内容を別タブの最新内容に置き換えます。必要なら先にJSON保存してください。',()=>{p=remote;remote=null;past=[];future=[];render();toast('別タブの更新を読み込みました');});
 }catch(e){console.error(e);toast(e.message||'操作を完了できませんでした');}
});
document.addEventListener('input',e=>{
 const el=e.target;if(el.id==='group-search'){ui.search=el.value;renderGroupList();return;}if(!el.dataset.edit||el.tagName==='SELECT'||el.type==='checkbox'||el.type==='month')return;const key=el.dataset.edit;
 try{updateInput(el,()=>{if(key.startsWith('item-')){const r=varOf().items.find(r=>r.id===el.dataset.id);if(!r)return;const f=key.slice(5);r[f]=f==='qty'?qInput(el.value):['unit','remaining','actualAmount'].includes(f)?(f==='remaining'&&moneyInput(el.value)!==null?Math.max(0,moneyInput(el.value)):moneyInput(el.value)):el.value;}
 else if(key.startsWith('group-'))group()[key.slice(6)]=el.value;
 else if(key==='month-actual'){const m=p.months.find(m=>m.ym===el.dataset.ym);m.actualNet=moneyInput(el.value);m.source='手入力';}
 else if(key.startsWith('flow-')){const ym=el.dataset.ym;sc().flows[ym]??={mode:'net',net:null,income:null,expense:null};sc().flows[ym][key.slice(5)]=moneyInput(el.value);}});}catch(err){console.error(err);toast(err.message);}
});
document.addEventListener('change',e=>{
 const el=e.target;if(el.id==='group-sort'){ui.sort=el.value;renderGroupList();return;}
 if(el.id==='bulk-month'){if(el.value)mutate('このプリセットの予定月を変更しました',()=>varOf().items.forEach(r=>r.month=el.value));return;}
 const key=el.dataset.edit;if(!key)return;
 if(el.tagName==='SELECT'||el.type==='checkbox'||el.type==='month'){
  mutate('',()=>{if(key.startsWith('item-')){const r=varOf().items.find(r=>r.id===el.dataset.id);r[key.slice(5)]=el.value;}
  else if(key==='group-enabled')group().enabled=el.checked;else if(key==='group-priority')group().priority=Number(el.value);
  else if(key==='month-phase'){const m=p.months.find(m=>m.ym===el.dataset.ym);m.phase=el.value;}
  else if(key==='flow-mode'){const f=sc().flows[el.dataset.ym];if(el.value==='net'&&f.mode==='detail')f.net=(f.income===null||f.expense===null)?null:f.income-f.expense;f.mode=el.value;}});
 }else{if(key==='group-title'&&!group().title.trim()){group().title='名称未設定';el.value=group().title;renderGroupList();}if(key==='item-title'){const r=varOf().items.find(r=>r.id===el.dataset.id);if(r&&!r.title.trim()){r.title='名称未設定';el.value=r.title;}}editingKey=null;persist();}
});
document.addEventListener('focusout',e=>{if(e.target.dataset.edit)editingKey=null;});
document.addEventListener('dragstart',e=>{const handle=e.target.closest('[data-drag]');if(!handle)return;ui.drag={kind:handle.dataset.drag,id:handle.dataset.id};e.dataTransfer.effectAllowed='move';e.dataTransfer.setData('text/plain',JSON.stringify(ui.drag));});
document.addEventListener('dragover',e=>{const dest=e.target.closest('[data-drop]');if(!dest||!ui.drag||dest.dataset.drop!==ui.drag.kind)return;e.preventDefault();e.dataTransfer.dropEffect='move';dest.classList.add('drag-over');});
document.addEventListener('dragleave',e=>{const d=e.target.closest('[data-drop]');if(d&&!d.contains(e.relatedTarget))d.classList.remove('drag-over');});
document.addEventListener('drop',e=>{const dest=e.target.closest('[data-drop]');if(!dest||!ui.drag||dest.dataset.drop!==ui.drag.kind)return;e.preventDefault();const src=ui.drag;ui.drag=null;reorder(src.kind,src.id,dest.dataset.id);});
document.addEventListener('dragend',()=>{ui.drag=null;$$('.drag-over').forEach(e=>e.classList.remove('drag-over'));});
document.addEventListener('keydown',e=>{if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='z'&&!['INPUT','TEXTAREA','SELECT'].includes(e.target.tagName)&&!$('#dialog').open){e.preventDefault();$('[data-action="'+(e.shiftKey?'redo':'undo')+'"]').click();}});
$('#json-file').addEventListener('change',async e=>{const f=e.target.files[0];if(!f)return;try{if(f.size>2500000)throw Error('JSONファイルは2.5MB以内で選択してください');const incoming=JSON.parse(await f.text());C.validateProject(incoming);confirmAction('計画JSONを読み込む','資金計画を「'+incoming.title+'」で置き換えます。既存の家計簿データは変更しません。',()=>{corrupt=false;remote=null;mutate('計画を読み込みました',()=>{p=incoming;ui.selected=null;ui.mobileDetail=false;});});}catch(err){toast('読込を中止しました：'+err.message);}finally{e.target.value='';}});
window.addEventListener('storage',e=>{if(BRIDGE||e.key!==KEY||!e.newValue)return;try{const x=JSON.parse(e.newValue);C.validateProject(x);if(JSON.stringify(x)!==JSON.stringify(p)){remote=x;status();}}catch(err){toast('別タブの保存内容を読み取れませんでした');}});
window.addEventListener('beforeunload',()=>{if(timer){clearTimeout(timer);timer=null;persist();}});
window.PlanningUI={getState:()=>C.clone(p),calculate:(s)=>C.calculate(p,s||sc()),refreshActuals:()=>{syncLedger();render();}};
render();
if(BRIDGE){
 document.body.classList.add('embedded');
 const notify=()=>{try{BRIDGE.resize(document.documentElement.scrollHeight);}catch(e){}};
 if(window.ResizeObserver)new ResizeObserver(notify).observe(document.getElementById('app'));
 window.addEventListener('load',notify);
 window.requestAnimationFrame(notify);
}
})();
</script></body></html>
